# FoundationPoseMaskNode: FoundationPose across N views, with SAM2 masks arriving
# over LCM from a separate SAM2MaskNode process. track_one runs every frame on
# the raw crop (no inline SAM2); masks are time-matched against a ring buffer of
# recent RGBD frames only for (re)registration.
name: foundation_pose_mask_node

object_name: "predefined_obj"
mesh_file: assets/object_mesh/ycb_006_mustard_bottle/textured_mesh.obj
# mesh_file: assets/object_mesh/0717_car/textured_mesh.obj
# mesh_file: assets/object_mesh/0722_rojo/textured_mesh.orig.ply
# mesh_file: assets/object_mesh/0722_drum/textured_mesh.orig.ply
# mesh_file: assets/object_mesh/0722_blocks_1/textured_mesh.orig.ply
# mesh_file: assets/object_mesh/0722_tumbler/textured_mesh.orig.ply
# mesh_file: assets/object_mesh/0724_pumpkin/textured_mesh.orig.ply

crop_ratio: 1.2

est_refine_iter: 1
track_refine_iter: 1

register_min_n_views: 12
register_inplane_step: 90
# ROI applied to rgb/depth/mask in this node (the SAM2 node runs full-frame).
# null + interactive_roi:true -> draw an ROI per view on the first frame.
# null + interactive_roi:false -> use the full frame.
# "x,y,w,h" -> fixed crop, no prompt.
scene_roi: null
interactive_roi: true

# Ring buffer of recent (timestamp, rgb_crop, depth_crop) per view, and how close
# a buffered frame must be (seconds) to a mask's timestamp to be used for
# registration.
rgbd_buffer_size: 60
mask_match_tolerance: 0.2

# SAM2 block is read by the shared base __init__ but no predictor is built here
# (this node consumes masks over LCM). Kept minimal to satisfy config lookups.
sam2:
  config_file: "configs/sam2.1/sam2.1_hiera_t.yaml"
  obj_id: 1

multiview:
  score_direction: min
  lost_threshold: 130
  lost_side: above
  resync_margin: 0.0
  resync_enable: true

auto_reset:
  enable: true
  streak: 5

visualize_sam: false
debug: 0
debug_dir: debug_output
visualize: true
quiet_logs: true
fps_report_every: 30
profile_stages: true

pose_filter:
  use_filter: false
  alpha: 0.7
  window_size: 0
  fix_x_rotation: false
  fix_z_rotation: false

sub_manager:
  name: multi_rgbd_mask
  rgbd_channels:
    # - upper_camera
    # - side_camera
    # - d455_1
    - d455_2
  mask_channels:
    # - upper_camera_mask
    # - side_camera_mask
    # - d455_1_mask
    - d455_2_mask
  max_sub_freq: 2000
pub_manager:
  name: named_vec
  named_vec_list_channel: hw_obj_pose
  max_pub_freq: 2000
